# Demonstração pública do Recorvia na VPS das demonstrações: duas organizações fictícias da carga de demonstração do produto
# (cmd/seed), contas compartilhadas do realm de demonstração e pagamentos só pelo simulador do produto (paysim). Sem saída para a
# internet: e-mails retidos no Mailpit, na rede interna, e webhooks para fora não são entregues.
#
# O proxy alcança só a interface (web), o login do Keycloak e o checkout do simulador, pela rede `union-demos`. A API fica só na
# rede interna: ela confia no X-Real-IP do nginx da interface. O emissor OIDC é o endereço público; a API descobre o Keycloak
# pela rede interna (RECORVIA_OIDC_DISCOVERY_URL) e, com KC_HOSTNAME_BACKCHANNEL_DYNAMIC, troca o código e busca as chaves por
# ela, sem alias no proxy. A revogação o Keycloak anuncia no endereço público, que a API não alcança: a v0.4.1 trata a falha
# (a sessão local termina, e a API registra um aviso).
#
# As imagens são construídas na VPS a partir da tag do produto (demo.sh construir ou subir). Suba pelo demo.sh: ele passa a
# faixa da rede do proxy (DEMOS_PROXY_SUBNET); sem ela, vale 127.0.0.1/32, que não confia em ninguém.
name: demo-recorvia

x-comum: &comum
  restart: unless-stopped
  oom_score_adj: 500
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-go-build: &go-build
  context: ${RECORVIA_SRC:-./src}
  dockerfile: deploy/docker/go.Dockerfile

# Ambiente comum à API, ao worker e à carga de demonstração. O worker e a carga ficam em development: em production o worker
# exige SMTP com TLS, e o Mailpit não tem. Sem RECORVIA_WEBHOOK_ALLOWED_PRIVATE_CIDRS, webhooks para endereços privados
# continuam bloqueados em qualquer ambiente.
x-app-env: &app-env
  RECORVIA_ENV: development
  RECORVIA_LOG_LEVEL: info
  RECORVIA_DATABASE_URL: postgres://recorvia_app:${RECORVIA_APP_PASSWORD:?}@postgres:5432/recorvia?sslmode=disable
  RECORVIA_REDIS_URL: redis://:${RECORVIA_REDIS_PASSWORD:?}@redis:6379/0
  RECORVIA_AMQP_URL: amqp://recorvia:${RECORVIA_RABBIT_PASSWORD:?}@rabbitmq:5672/
  RECORVIA_PUBLIC_URL: https://${DEMO_HOST:?}
  RECORVIA_OIDC_ISSUER: https://${DEMO_HOST:?}/realms/recorvia
  RECORVIA_OIDC_DISCOVERY_URL: http://recorvia-keycloak:8080/realms/recorvia
  RECORVIA_OIDC_CLIENT_ID: recorvia-web
  RECORVIA_OIDC_CLIENT_SECRET: ${RECORVIA_OIDC_CLIENT_SECRET:?}
  RECORVIA_OIDC_REDIRECT_URL: https://${DEMO_HOST:?}/auth/callback
  RECORVIA_ENCRYPTION_KEYS: ${RECORVIA_ENCRYPTION_KEYS:?}
  RECORVIA_ENCRYPTION_ACTIVE_KEY: ${RECORVIA_ENCRYPTION_ACTIVE_KEY:?}
  RECORVIA_SMTP_ADDR: mailpit:1025
  RECORVIA_SMTP_FROM: cobranca@recorvia.test
  RECORVIA_SMTP_TLS: none
  RECORVIA_PAYSIM_URL: http://paysim:8090
  # O simulador entrega os webhooks pela rede interna; /webhooks/* fica fechado no proxy.
  RECORVIA_WEBHOOK_PUBLIC_URL: http://recorvia-api:8081/webhooks/providers
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

services:
  postgres:
    <<: *comum
    image: union-demos-postgres:16
    build:
      context: ../imagens
      dockerfile: postgres.Dockerfile
    user: "70:70"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RECORVIA_DB_PASSWORD:?}
    volumes:
      - dados:/var/lib/postgresql/data
    networks: [interna]
    mem_limit: 256m
    healthcheck:
      # Pelo TCP: durante a inicialização do volume, o servidor provisório só atende pelo socket local.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Papéis recorvia_owner e recorvia_app e o banco do produto, com o superusuário. Idempotente.
  migrate-bootstrap:
    <<: *comum
    image: demo-recorvia-migrate:latest
    build:
      <<: *go-build
      args: { CMD: migrate, VERSION: "${RECORVIA_TAG:?}" }
    command: ["bootstrap"]
    restart: "no"
    environment:
      RECORVIA_BOOTSTRAP_DATABASE_URL: postgres://postgres:${RECORVIA_DB_PASSWORD:?}@postgres:5432/postgres?sslmode=disable
      RECORVIA_OWNER_PASSWORD: ${RECORVIA_OWNER_PASSWORD:?}
      RECORVIA_APP_PASSWORD: ${RECORVIA_APP_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]
    mem_limit: 128m

  # Migrations como recorvia_owner. Em development, inclui a conta equipe@recorvia.test do realm na equipe da plataforma
  # (tela /admin/servicos).
  migrate:
    <<: *comum
    image: demo-recorvia-migrate:latest
    command: ["up"]
    restart: "no"
    environment:
      RECORVIA_ENV: development
      RECORVIA_MIGRATIONS_DATABASE_URL: postgres://recorvia_owner:${RECORVIA_OWNER_PASSWORD:?}@postgres:5432/recorvia?sslmode=disable
      RECORVIA_OIDC_ISSUER: https://${DEMO_HOST:?}/realms/recorvia
      RECORVIA_DEMO_STAFF_SUBJECT: 7f3c6a2e-0b1d-4c55-9a8e-1a2b3c4d5e06
      RECORVIA_DEMO_STAFF_EMAIL: equipe@recorvia.test
    depends_on:
      migrate-bootstrap:
        condition: service_completed_successfully
    networks: [interna]
    mem_limit: 128m

  redis:
    <<: *comum
    image: redis:8.8.4-alpine@sha256:1273af45b299d2b8b60d0e400d90aa6c2c5b1794f01d6a7ca60ff3ba6e65efb5
    # Sessões, login e limites de taxa, sem persistência. A senha vai para um arquivo de configuração, e não para a linha de
    # comando. Com o limite, as chaves com prazo (sessões) saem antes do estouro de memória do contêiner.
    command: ["sh", "-c", "umask 077 && printf 'requirepass %s\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf && chown redis:redis /tmp/redis.conf && exec docker-entrypoint.sh redis-server /tmp/redis.conf --save '' --appendonly no --maxmemory 40mb --maxmemory-policy volatile-lru"]
    environment:
      REDIS_PASSWORD: ${RECORVIA_REDIS_PASSWORD:?}
    networks: [interna]
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    <<: *comum
    # A versão do produto, sem o painel de administração: a demonstração não o expõe, e a imagem sem ele usa menos memória.
    image: rabbitmq:4.2.9-alpine@sha256:1427f0740d94176f4dbaddb4afdcb44a486203005f4877875d3d0f38738babbb
    # Servidor e verificação de saúde com o mesmo usuário, como no produto.
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: recorvia
      RABBITMQ_DEFAULT_PASS: ${RECORVIA_RABBIT_PASSWORD:?}
    networks: [interna]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Recebe os e-mails do worker e não entrega nada: não há saída para a internet nem interface publicada. A conta SMTP do portal
  # não é usada porque qualquer visitante poderia disparar e-mails pela caixa da Union (avisos de fatura a endereços que ele
  # mesmo cadastra). O link do portal do cliente aparece na própria tela do cliente, sem depender do e-mail.
  mailpit:
    <<: *comum
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    user: "65534:65534"
    networks: [interna]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Simulador de pagamentos do produto. O proxy só leva a ele o checkout (GET e POST /checkout/*); a API do simulador (/v1/*)
  # e os controles (/sim/*) ficam fechados.
  paysim:
    <<: *comum
    image: demo-recorvia-paysim:latest
    build:
      <<: *go-build
      args: { CMD: paysim, VERSION: "${RECORVIA_TAG:?}" }
    environment:
      PAYSIM_ADDR: ":8090"
      PAYSIM_PUBLIC_URL: https://${DEMO_HOST:?}
      PAYSIM_STATE_FILE: /data/state.json
      PAYSIM_TIMEOUT_DELAY: 25s
    volumes:
      - pagamentos:/data
    networks:
      interna:
      demos:
        aliases: [recorvia-paysim]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    <<: *comum
    # Keycloak 26.8.1 com a Guava corrigida (demos/imagens/keycloak.Dockerfile). Banco embutido do modo de desenvolvimento,
    # dentro do contêiner: o `down -v` do reinício diário recria o contêiner, e o realm volta ao da tag.
    image: union-demos-keycloak:26.8.1
    build:
      context: ../imagens
      dockerfile: keycloak.Dockerfile
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${RECORVIA_KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: https://${DEMO_HOST:?}
      # Navegador pelo endereço público; a API pela rede interna, com os endpoints de retaguarda no endereço pedido.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${DEMOS_PROXY_SUBNET:-127.0.0.1/32}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    volumes:
      - ${RECORVIA_SRC:-./src}/deploy/keycloak/realm-recorvia.json:/opt/keycloak/data/import/realm-recorvia.json:ro
    networks:
      interna:
        aliases: [recorvia-keycloak]
      demos:
        aliases: [recorvia-keycloak]
    mem_limit: 768m
    healthcheck:
      # A descoberta do realm, como no produto: na primeira partida, /health/ready responde antes do fim da importação.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/recorvia/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"issuer\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    <<: *comum
    image: demo-recorvia-api:latest
    build:
      <<: *go-build
      args: { CMD: api, VERSION: "${RECORVIA_TAG:?}" }
    environment:
      <<: *app-env
      # Cookies __Host- seguros, HTTPS obrigatório no endereço público e HSTS, como na produção do produto.
      RECORVIA_ENV: production
      RECORVIA_HTTP_ADDR: ":8081"
      RECORVIA_METRICS_ADDR: ":9091"
      GOMEMLIMIT: 200MiB
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Só na rede interna; o alias evita qualquer ambiguidade com o nome curto "api" de outras demonstrações.
    networks:
      interna:
        aliases: [recorvia-api]
    mem_limit: 256m
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *comum
    image: demo-recorvia-worker:latest
    build:
      <<: *go-build
      args: { CMD: worker, VERSION: "${RECORVIA_TAG:?}" }
    environment:
      <<: *app-env
      RECORVIA_METRICS_ADDR: ":9091"
      RECORVIA_WORKER_CONCURRENCY: "4"
      RECORVIA_WORKER_PREFETCH: "8"
      GOMEMLIMIT: 200MiB
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks: [interna]
    mem_limit: 256m
    # Drenagem no SIGTERM, como no produto (mensagem em andamento com até 2 min).
    stop_grace_period: 2m30s
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Só a construção da imagem da interface do produto (web/Dockerfile da tag), base do serviço web; nenhum contêiner sobe.
  web-base:
    image: demo-recorvia-web-base:latest
    build:
      context: ${RECORVIA_SRC:-./src}/web
    scale: 0
    networks: [interna]
    mem_limit: 64m

  web:
    <<: *comum
    image: demo-recorvia-web:latest
    # O nginx do produto fixa a API em "api", nome que na rede union-demos responde por outras demonstrações. Aqui ele passa a
    # usar o alias recorvia-api, e a construção falha se a troca não acontecer.
    build:
      context: ${RECORVIA_SRC:-./src}/web
      additional_contexts:
        base: service:web-base
      dockerfile_inline: |
        FROM base
        USER root
        RUN sed -i 's#http://api:8081;#http://recorvia-api:8081;#' /etc/nginx/conf.d/default.conf \
          && grep -qF 'http://recorvia-api:8081;' /etc/nginx/conf.d/default.conf \
          && ! grep -qF '//api:' /etc/nginx/conf.d/default.conf
        USER 101
    environment:
      # Só o X-Forwarded-For vindo da rede do proxy das demonstrações vale como endereço do cliente.
      RECORVIA_TRUSTED_PROXIES: ${DEMOS_PROXY_SUBNET:-127.0.0.1/32}
    depends_on:
      api:
        condition: service_healthy
    networks:
      interna:
      demos:
        aliases: [recorvia-web]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Carga de demonstração do produto (idempotente), por demo.sh depois do ajuste do Keycloak.
  seed:
    <<: *comum
    image: demo-recorvia-seed:latest
    profiles: ["seed"]
    build:
      <<: *go-build
      args: { CMD: seed, VERSION: "${RECORVIA_TAG:?}" }
    restart: "no"
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      paysim:
        condition: service_healthy
    networks: [interna]
    mem_limit: 128m

volumes:
  dados:
  pagamentos:

networks:
  interna:
    internal: true
  demos:
    external: true
    name: ${DEMOS_NETWORK:-union-demos}
