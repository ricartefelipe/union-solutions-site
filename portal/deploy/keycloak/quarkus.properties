# Propriedade do Quarkus sem opção equivalente no Keycloak: valida cada conexão do pool antes de usar, como a API.
# Sem isso, depois de um reinício não planejado do banco, o primeiro uso de cada conexão antiga falha, e o primeiro
# login mostra "Erro inesperado ao tratar o pedido de autenticação".
quarkus.datasource.jdbc.validate-on-borrow=true
