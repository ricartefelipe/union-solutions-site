# Aplicação
portal.public-url=${PORTAL_PUBLIC_URL:http://localhost:3100}
portal.invitation.ttl=${PORTAL_INVITATION_TTL:P7D}
portal.demo.enabled=false
portal.bootstrap.admin-email=${PORTAL_BOOTSTRAP_ADMIN_EMAIL:}
portal.products.allowed-link-hosts=${PORTAL_PRODUCT_LINK_HOSTS:}

# Banco
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${PORTAL_DB_URL:}
%prod.quarkus.datasource.username=${PORTAL_DB_USER:}
%prod.quarkus.datasource.password=${PORTAL_DB_PASSWORD:}
%local.quarkus.datasource.jdbc.url=${PORTAL_DB_URL:jdbc:postgresql://postgres:5432/portal}
%local.quarkus.datasource.username=${PORTAL_DB_USER:portal}
%local.quarkus.datasource.password=${PORTAL_DB_PASSWORD:}
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC

# Identidade: a API valida o token no próprio servidor
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${PORTAL_OIDC_INTERNAL_URL:http://localhost:8180/realms/union-portal}
quarkus.oidc.client-id=portal-api
quarkus.oidc.token.issuer=${PORTAL_OIDC_ISSUER:http://localhost:8180/realms/union-portal}
quarkus.oidc.token.audience=portal-api
portal.identity.base-url=${PORTAL_KEYCLOAK_INTERNAL_URL:http://localhost:8180}
portal.identity.realm=${PORTAL_KEYCLOAK_REALM:union-portal}
portal.identity.admin-client-id=${PORTAL_KEYCLOAK_ADMIN_CLIENT:portal-admin}
portal.identity.admin-client-secret=${PORTAL_KEYCLOAK_ADMIN_SECRET:}
portal.identity.web-client-id=${PORTAL_KEYCLOAK_WEB_CLIENT:portal-web}
portal.identity.action-lifespan-seconds=${PORTAL_KEYCLOAK_ACTION_LIFESPAN:43200}

# Acesso: nada sem autenticação, exceto a inspeção de convites
quarkus.http.auth.permission.public.paths=/v1/public/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.api.paths=/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.proactive=true
quarkus.http.cors.enabled=false

# Limites de entrada
quarkus.jackson.fail-on-unknown-properties=true
quarkus.http.limits.max-body-size=${PORTAL_HTTP_MAX_BODY:40M}
quarkus.http.limits.max-form-attribute-size=16K
quarkus.http.body.delete-uploaded-files-on-end=true

# Arquivos
portal.files.max-bytes=${PORTAL_FILE_MAX_BYTES:26214400}
portal.files.tenant-quota-bytes=${PORTAL_FILE_TENANT_QUOTA_BYTES:5368709120}
portal.storage.endpoint=${PORTAL_S3_ENDPOINT:}
portal.storage.region=${PORTAL_S3_REGION:us-east-1}
portal.storage.bucket=${PORTAL_S3_BUCKET:portal-private}
portal.storage.access-key=${PORTAL_S3_ACCESS_KEY:}
portal.storage.secret-key=${PORTAL_S3_SECRET_KEY:}
portal.storage.path-style=${PORTAL_S3_PATH_STYLE:false}
portal.storage.create-bucket=false
portal.scan.host=${PORTAL_CLAMD_HOST:localhost}
portal.scan.port=${PORTAL_CLAMD_PORT:3310}
portal.scan.interval=${PORTAL_SCAN_INTERVAL:5s}
portal.scan.batch-size=10
portal.scan.max-attempts=${PORTAL_SCAN_MAX_ATTEMPTS:30}
portal.scan.chunk-timeout-ms=60000
# Objetos sem registro definitivo: limpeza periódica, só depois da idade mínima
portal.ledger.interval=${PORTAL_LEDGER_INTERVAL:5m}
portal.ledger.min-age=${PORTAL_LEDGER_MIN_AGE:PT10M}

# E-mail: produção exige SMTP real (ver ProductionChecks)
quarkus.mailer.from=${PORTAL_MAIL_FROM:}
quarkus.mailer.host=${PORTAL_SMTP_HOST:localhost}
quarkus.mailer.port=${PORTAL_SMTP_PORT:1025}
quarkus.mailer.username=${PORTAL_SMTP_USER:}
quarkus.mailer.password=${PORTAL_SMTP_PASSWORD:}
quarkus.mailer.start-tls=${PORTAL_SMTP_START_TLS:REQUIRED}
quarkus.mailer.tls=false
quarkus.mailer.mock=false

# Observabilidade: saúde, métricas e OpenAPI só na porta de gestão, que não é publicada
quarkus.management.enabled=true
quarkus.management.host=0.0.0.0
quarkus.management.port=9000
quarkus.smallrye-openapi.management.enabled=true
quarkus.smallrye-openapi.store-schema-directory=${PORTAL_OPENAPI_DIR:target/openapi}
quarkus.swagger-ui.always-include=false
mp.openapi.extensions.smallrye.info.title=Portal do Cliente Union Solutions
mp.openapi.extensions.smallrye.info.version=0.1.0
quarkus.log.console.json.enabled=true
quarkus.log.level=INFO
quarkus.http.access-log.enabled=false
quarkus.shutdown.timeout=20S

# Ambiente local (Docker Compose): nunca usado em produção
%local.portal.demo.enabled=${PORTAL_DEMO_ENABLED:false}
%local.portal.demo.password=${PORTAL_DEMO_PASSWORD:}
%local.portal.storage.create-bucket=true
%local.quarkus.mailer.start-tls=DISABLED

# Testes
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine
%test.quarkus.http.test-port=0
%test.quarkus.mailer.mock=true
%test.quarkus.mailer.from=teste@portal.invalid
%test.quarkus.scheduler.enabled=false
%test.portal.products.allowed-link-hosts=produto.exemplo.com.br
%test.quarkus.oidc.auth-server-url=${keycloak.url}/realms/quarkus/
%test.quarkus.oidc.token.issuer=https://server.example.com
%test.quarkus.oidc.client-id=quarkus-web-app
%test.quarkus.management.enabled=false
%test.quarkus.smallrye-openapi.management.enabled=false
%test.quarkus.log.console.json.enabled=false
%test.smallrye.jwt.sign.key.location=privateKey.jwk
%test.portal.storage.bucket=teste
%test.portal.files.max-bytes=2048
%test.portal.files.tenant-quota-bytes=6100
