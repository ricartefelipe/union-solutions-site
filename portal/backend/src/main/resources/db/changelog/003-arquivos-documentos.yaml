databaseChangeLog:
  - changeSet:
      id: 003-arquivos-documentos
      author: union-solutions
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE stored_file (
                id uuid PRIMARY KEY,
                tenant_id uuid NOT NULL REFERENCES organization (id),
                object_key varchar(200) NOT NULL UNIQUE,
                original_name varchar(255) NOT NULL,
                media_type varchar(120) NOT NULL,
                size_bytes bigint NOT NULL CHECK (size_bytes > 0),
                sha256 varchar(64) NOT NULL,
                scan_status varchar(20) NOT NULL DEFAULT 'PENDING'
                  CHECK (scan_status IN ('PENDING', 'CLEAN', 'REJECTED', 'FAILED')),
                scan_attempts integer NOT NULL DEFAULT 0,
                scan_claimed_until timestamptz,
                scan_detail varchar(200),
                scanned_at timestamptz,
                uploaded_by uuid NOT NULL REFERENCES app_user (id),
                created_at timestamptz NOT NULL,
                CONSTRAINT stored_file_tenant_uq UNIQUE (tenant_id, id)
              );
              CREATE INDEX stored_file_scan_idx ON stored_file (scan_status, created_at) WHERE scan_status = 'PENDING';
              CREATE INDEX stored_file_tenant_idx ON stored_file (tenant_id);

              CREATE TABLE document (
                id uuid PRIMARY KEY,
                tenant_id uuid NOT NULL REFERENCES organization (id),
                project_id uuid,
                title varchar(200) NOT NULL,
                category varchar(20) NOT NULL CHECK (category IN ('PROPOSAL', 'CONTRACT', 'DESIGN', 'REPORT', 'OTHER')),
                visibility varchar(20) NOT NULL CHECK (visibility IN ('INTERNAL', 'CLIENT_ADMINS', 'PARTICIPANTS')),
                status varchar(20) NOT NULL DEFAULT 'ACTIVE' CHECK (status IN ('ACTIVE', 'ARCHIVED')),
                current_version integer NOT NULL DEFAULT 1,
                created_by uuid NOT NULL REFERENCES app_user (id),
                created_at timestamptz NOT NULL,
                updated_at timestamptz NOT NULL,
                version bigint NOT NULL DEFAULT 0,
                CONSTRAINT document_tenant_uq UNIQUE (tenant_id, id),
                CONSTRAINT document_project_fk FOREIGN KEY (tenant_id, project_id) REFERENCES project (tenant_id, id)
              );
              CREATE INDEX document_tenant_idx ON document (tenant_id, created_at DESC);
              CREATE INDEX document_project_idx ON document (project_id);

              CREATE TABLE document_version (
                id uuid PRIMARY KEY,
                tenant_id uuid NOT NULL,
                document_id uuid NOT NULL,
                version_no integer NOT NULL CHECK (version_no > 0),
                file_id uuid NOT NULL,
                author_id uuid NOT NULL REFERENCES app_user (id),
                note varchar(500),
                created_at timestamptz NOT NULL,
                CONSTRAINT document_version_tenant_uq UNIQUE (tenant_id, id),
                CONSTRAINT document_version_no_uq UNIQUE (document_id, version_no),
                CONSTRAINT document_version_document_fk FOREIGN KEY (tenant_id, document_id) REFERENCES document (tenant_id, id),
                CONSTRAINT document_version_file_fk FOREIGN KEY (tenant_id, file_id) REFERENCES stored_file (tenant_id, id)
              );
