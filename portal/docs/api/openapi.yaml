      type: object
      properties:
        action:
          type: string
        summary:
          type: string
        actorName:
          type: string
        createdAt:
          $ref: "#/components/schemas/Instant"
    TicketInput:
      type: object
      properties:
        organizationId:
          $ref: "#/components/schemas/UUID"
        projectId:
          $ref: "#/components/schemas/UUID"
        subject:
          type: string
          pattern: \S
          maxLength: 200
        description:
          type: string
          pattern: \S
          maxLength: 8000
        category:
          $ref: "#/components/schemas/TicketCategory"
        priority:
          $ref: "#/components/schemas/TicketPriority"
      required:
      - subject
      - description
      - category
      - priority
    TicketPatch:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/TicketStatus"
        priority:
          $ref: "#/components/schemas/TicketPriority"
        assigneeId:
          $ref: "#/components/schemas/UUID"
        clearAssignee:
          type: boolean
        slaDueAt:
          $ref: "#/components/schemas/Instant"
        version:
          type: integer
          format: int64
      required:
      - version
    TicketPriority:
      type: string
      enum:
      - LOW
      - NORMAL
      - HIGH
      - URGENT
    TicketStatus:
      type: string
      enum:
      - OPEN
      - IN_PROGRESS
      - WAITING_CLIENT
      - RESOLVED
      - CLOSED
    TicketSummary:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        tenantId:
          $ref: "#/components/schemas/UUID"
        organizationName:
          type: string
        projectId:
          $ref: "#/components/schemas/UUID"
        projectName:
          type: string
        subject:
          type: string
        category:
          $ref: "#/components/schemas/TicketCategory"
        priority:
          $ref: "#/components/schemas/TicketPriority"
        status:
          $ref: "#/components/schemas/TicketStatus"
        slaDueAt:
          $ref: "#/components/schemas/Instant"
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
